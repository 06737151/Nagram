name: Release Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      JOBS: '2'
      ABIS: 'arm64-v8a'
      NATIVE_TARGET: 'arm64-v8a'

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate secrets and prepare signing certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess

          required = ('KEYSTORE_BASE64', 'KEYSTORE_PASS', 'ALIAS_NAME',
                      'ALIAS_PASS', 'TELEGRAM_APP_ID', 'TELEGRAM_APP_HASH')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Actions secrets: ' + ', '.join(missing))
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['TELEGRAM_APP_ID']):
              raise SystemExit('TELEGRAM_APP_ID must be a positive integer.')
          if not re.fullmatch(r'[0-9a-fA-F]{32}', os.environ['TELEGRAM_APP_HASH']):
              raise SystemExit('TELEGRAM_APP_HASH must contain 32 hexadecimal characters.')

          def restore(name, filename):
              try:
                  data = base64.b64decode(''.join(os.environ[name].split()), validate=True)
              except ValueError:
                  raise SystemExit(name + ' is not valid Base64.') from None
              if not data:
                  raise SystemExit(name + ' decoded to an empty file.')
              path = Path(filename)
              path.write_bytes(data)
              path.chmod(0o600)

          restore('KEYSTORE_BASE64', 'TMessagesProj/release.keystore')
          cert = Path(os.environ['RUNNER_TEMP']) / 'release-certificate.der'
          result = subprocess.run([
              'keytool', '-exportcert', '-keystore', 'TMessagesProj/release.keystore',
              '-storepass:env', 'KEYSTORE_PASS', '-alias', os.environ['ALIAS_NAME'],
              '-file', str(cert),
          ], capture_output=True)
          if result.returncode:
              raise SystemExit('Cannot read signing certificate: check the keystore, KEYSTORE_PASS and ALIAS_NAME.')

          # The native code hashes the DER certificate from the APK v2 signing block.
          # Keep its verification enabled, and trust this fork's own certificate.
          sha1 = hashlib.sha1(cert.read_bytes()).hexdigest().upper()
          path = Path('TMessagesProj/jni/integrity/integrity.cpp')
          source, count = re.subn(
              r'(static\s+const\s+char\s*\*\s*SIGN\s*=\s*")[0-9A-Fa-f]{40}("\s*;)',
              lambda m: m[1] + sha1 + m[2], path.read_text(encoding='utf-8'))
          if count != 1:
              raise SystemExit('The native signature check changed; update this workflow before building.')
          path.write_text(source, encoding='utf-8')

          if os.environ.get('GOOGLE_SERVICES_JSON_BASE64'):
              restore('GOOGLE_SERVICES_JSON_BASE64', 'TMessagesProj/google-services.json')
          print('Signing certificate and required configuration are ready.')
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Configure build environment
        run: |
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/27.2.12479018\n' \
            "$ANDROID_HOME" "$ANDROID_HOME" > local.properties
          python3 - <<'PY'
          from pathlib import Path
          import re
          import time

          path = Path('gradle.properties')
          text = path.read_text(encoding='utf-8')
          values = {
              'org.gradle.jvmargs': '-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8',
              'org.gradle.workers.max': '2',
              'org.gradle.parallel': 'false',
              'org.gradle.daemon': 'false',
              'APP_BUILD_TIMESTAMP': str(time.time_ns() // 1_000_000),
          }
          for key, value in values.items():
              pattern = re.compile(r'^' + re.escape(key) + r'=.*$', re.MULTILINE)
              if pattern.search(text):
                  text = pattern.sub(lambda m: key + '=' + value, text)
              else:
                  text += '\n' + key + '=' + value + '\n'
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x gradlew run
          find bin -type f -name '*.sh' -exec chmod +x {} +
          git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Calculate native cache key
        run: |
          # Git tree IDs include native source, prebuilt libraries and submodule commits.
          git ls-tree HEAD TMessagesProj/jni bin/init bin/libs buildSrc \
            TMessagesProj/build.gradle build.gradle settings.gradle \
            gradle.properties gradle/wrapper .github/workflows/release.yml > native-inputs.txt
          # A different signing certificate must never reuse the previous native library.
          sha256sum TMessagesProj/jni/integrity/integrity.cpp >> native-inputs.txt

      - name: Restore compiled native libraries
        id: native-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            TMessagesProj/src/main/libs/arm64-v8a/libtmessages*.so
          key: native-signed-arm64-v2-${{ runner.os }}-ndk27-${{ hashFiles('native-inputs.txt') }}

      - name: Install native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison curl git golang-go cmake ninja-build \
            nasm yasm meson python3 pkg-config patch perl

      - name: Compile native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive --depth 1
          # Separate commands ensure an earlier library failure stops the build.
          ./run init libs libvpx
          ./run init libs dav1d
          ./run init libs ffmpeg
          # The upstream BoringSSL wrapper always builds both ARM architectures.
          # Call its build script directly with the arm64 target.
          source bin/init/env.sh
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          export NINJA_PATH="$(command -v ninja)"
          (
            cd TMessagesProj/jni
            ./patch_boringssl.sh
            ./build_boringssl.sh arm64
          )

      - name: Compile Telegram native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          ./run libs native

      - name: Check arm64-v8a native library
        run: |
          test -s TMessagesProj/src/main/libs/arm64-v8a/libtmessages.49.so

      - name: Build signed arm64-v8a Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          ./gradlew :TMessagesProj:assembleRelease \
            --no-daemon --max-workers=2 --build-cache --no-configuration-cache

      - name: Verify and name the arm64-v8a APK
        id: package
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import zipfile

          cert = Path(os.environ['RUNNER_TEMP']) / 'release-certificate.der'
          expected = hashlib.sha256(cert.read_bytes()).hexdigest()
          apksigner = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner'
          root = Path('TMessagesProj/build/outputs/apk/release')
          apks = list(root.glob('*.apk'))
          if len(apks) != 1 or 'arm64-v8a' not in apks[0].name:
              raise SystemExit('Expected exactly one arm64-v8a Release APK.')
          apk = apks[0]
          result = subprocess.run([str(apksigner), 'verify', '--verbose', '--print-certs', str(apk)],
                                  check=True, capture_output=True, text=True)
          if ('Signer #1 certificate SHA-256 digest: ' + expected).lower() not in result.stdout.lower():
              raise SystemExit('The APK signing certificate does not match the configured keystore.')
          if 'Verified using v2 scheme (APK Signature Scheme v2): true' not in result.stdout:
              raise SystemExit('APK v2 signing is required by the native signature check.')
          with zipfile.ZipFile(apk) as archive:
              info = archive.getinfo('lib/arm64-v8a/libtmessages.49.so')
              if info.file_size == 0:
                  raise SystemExit('The packaged native library is empty.')
              abis = {name.split('/')[1] for name in archive.namelist()
                      if name.startswith('lib/') and name.endswith('.so')}
              if abis != {'arm64-v8a'}:
                  raise SystemExit('The APK contains an unexpected native architecture.')

          properties = Path('gradle.properties').read_text(encoding='utf-8')
          versions = re.findall(r'^APP_VERSION_NAME[ \t]*=[ \t]*(.+)$', properties, re.MULTILINE)
          if len(versions) != 1:
              raise SystemExit('Expected one APP_VERSION_NAME in gradle.properties.')
          version = versions[0].strip()
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]*', version):
              raise SystemExit('APP_VERSION_NAME contains unsupported filename characters.')
          name = 'nagram_' + version
          destination = Path('artifacts') / (name + '.apk')
          destination.parent.mkdir(exist_ok=True)
          # Copy the signed file unchanged: its filename is not part of the signature.
          shutil.copyfile(apk, destination)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('artifact_name=' + name + '\n')
              output.write('apk_path=' + destination.as_posix() + '\n')
          print('Verified and packaged:', destination.name)
          PY

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload obfuscation mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Release-mapping-${{ github.run_number }}
          path: TMessagesProj/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f TMessagesProj/release.keystore local.properties \
            "$RUNNER_TEMP/release-certificate.der"
